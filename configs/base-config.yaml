project:
  name: "ml_training_pipeline"
  version: "1.0.0"
  random_seed: 42
data:
  raw_data_path: "data/raw/data.csv"
  target_column: "target"
  test_size: 0.2
model:
  name: "xgboost"
  params:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.05
    scale_pos_weight: 1.0
    random_state: 42
tuning:
  n_trials: 20
  cv_folds: 5
  metric: "roc_auc"

  search_space:
    n_estimators:
      type: "int"
      low: 50
      high: 300

    max_depth:
      type: "int"
      low: 3
      high: 10

    learning_rate:
      type: "float"
      low: 0.01
      high: 0.3
      log: true

    scale_pos_weight:
      type: "float"
      low: 0.5
      high: 5.0
    