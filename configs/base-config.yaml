project:
  name: "ml_training_pipeline"
  version: "1.0.0"
  random_seed: 42
data:
  raw_data_path: "data/raw/data.csv"
  target_column: "target"
  test_size: 0.2
model:
  name: "xgboost"
  params:
    n_estimators: 100
    max_depth: 6
    learning_rate: 0.05
    scale_pos_weight: 1.0
    random_state: 42